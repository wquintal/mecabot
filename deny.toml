# cargo-deny — la porte qui applique mécaniquement une décision verrouillée.
#
# `docs/09` §1 et §3 posent la règle suivante : la diffusion de Mecabot n'est pas
# décidée, et **aucune dépendance GPL** n'est introduite tant qu'elle ne l'est pas.
# Jusqu'ici c'était une phrase de documentation. Ici, c'est un build qui casse.
#
# Voir `docs/12` §6 pour le cadre d'emprunt aux standards punt-kit.

[graph]
# Les trois plateformes visées par `docs/09` §2, plus la cible Pi Zero 2 W de §11.4.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = true

# ---------------------------------------------------------------------------
# Licences — le cœur de ce fichier
# ---------------------------------------------------------------------------

[licenses]
version = 2

# Liste d'autorisation stricte : toute licence absente de cette liste fait
# échouer la vérification. La GPL n'est donc pas « refusée » par une règle
# qu'on pourrait oublier de mettre à jour — elle est exclue par omission,
# ce qui est le sens de la marche le plus sûr.
#
# ⛔ Conséquence directe et voulue : `ecu-diagnostics` (GPL-3.0) et
# CaringCaribou (GPL-3.0) ne peuvent pas entrer par accident, même en
# dépendance transitive. Ce sont les deux tentations réelles du domaine.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0", # copyleft faible, au fichier — ne contamine pas le projet
]

confidence-threshold = 0.93

# Aucune exception pour l'instant. Toute entrée ici doit être justifiée en
# commentaire, avec la raison et la date — c'est le registre des dérogations.
exceptions = []

# ---------------------------------------------------------------------------
# Avis de sécurité
# ---------------------------------------------------------------------------

[advisories]
version = 2
yanked = "deny"
# Aucun avis ignoré. Toute entrée ici doit porter la date et le motif.
ignore = []

# ---------------------------------------------------------------------------
# Interdictions ciblées — la liste « à ne pas utiliser » de `docs/09` §3,
# rendue exécutable plutôt que laissée en prose.
# ---------------------------------------------------------------------------

[bans]
multiple-versions = "warn"
wildcards = "deny"

deny = [
    # GPL-3.0 contaminante, et build docs.rs cassé. `docs/09` §3.
    { crate = "ecu-diagnostics", reason = "GPL-3.0 — interdit par la règle de licence de docs/09 §3" },
    # Linux uniquement : casserait le multiplateforme, qui est une décision
    # verrouillée. La segmentation ISO-TP est de toute façon déléguée au
    # firmware du STN2120 (`docs/09` §3), donc ce crate n'a aucune raison d'entrer.
    { crate = "socketcan", reason = "Linux-only — incompatible avec la cible multiplateforme de docs/09 §1" },
]

# ---------------------------------------------------------------------------
# Provenance des sources
# ---------------------------------------------------------------------------

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
