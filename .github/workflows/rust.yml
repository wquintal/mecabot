name: rust

# Porte de qualité Rust. Elle est en place avant la première ligne de code,
# pas après coup — introduire `clippy -D warnings` sur une base existante coûte
# une session de rattrapage.
#
# ⚠️ Les filtres `paths` ne suffisent PAS à la mettre en veille, et le premier
# commit l'a prouvé : `deny.toml` et ce fichier figurent dans la liste, donc le
# workflow s'est déclenché sur un dépôt sans `Cargo.toml` et a échoué. La veille
# est portée par la tâche `guard` ci-dessous, qui teste la présence réelle de
# `Cargo.toml`. Les `paths` ne font plus qu'éviter des exécutions inutiles.
#
# ⛔ Ne pas ajouter `rust` aux vérifications obligatoires de la branche `main`
# tant qu'il n'a pas tourné en vert au moins une fois sur du vrai code : une
# vérification requise qui ne s'exécute jamais bloque toutes les fusions.
#
# Le standard `github.md` de punt-kit n'a aucune ligne Rust (docs/12 §2) —
# ce fichier est la transposition locale de ce qu'il impose pour Python.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'src/**'
      - 'crates/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'src/**'
      - 'crates/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # La sentinelle. Tant qu'aucun `Cargo.toml` n'existe, les trois tâches
  # suivantes sont sautées — le workflow est neutre au lieu d'être rouge.
  # Un workflow rouge en permanence entraîne à ignorer le rouge.
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_rust: ${{ steps.detect.outputs.has_rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Cargo.toml
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml present — running the Rust gate."
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml — the project is still documentation only. Skipping."
          fi

  lint:
    name: lint
    needs: guard
    if: needs.guard.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    needs: guard
    if: needs.guard.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # Les étapes 1 et 2 de `docs/10` §10 se développent contre le transport
      # de rejeu, donc la suite tourne entièrement sans véhicule ni adaptateur.
      - name: Test
        run: cargo test --all-features --workspace

  deny:
    name: deny
    needs: guard
    if: needs.guard.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⭐ La porte qui applique la règle « aucune dépendance GPL » de
      # `docs/09` §1. Voir les commentaires de `deny.toml`.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources advisories
